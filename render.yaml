# Render.com blueprint: one always-on web service with a persistent disk for
# the database file and encrypted documents. Deploy with "New → Blueprint".
services:
  - type: web
    name: advanced-landscape-2000
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: als2000-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: DASHBOARD_NAME
        value: Advanced Landscape 2000
      - key: DASHBOARD_API_KEY
        generateValue: true
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
